.koe{--bg:#f7f4ee;--paper:#fffdf9;--ink:#1d1b18;--mute:#7a736a;--line:#e8e2d6;--acc:#d9480f;--acc2:#1f6f5c;--neg:#8a1c1c;--mono:ui-monospace,Menlo,monospace;--sans:sans-serif;--serif:serif}
.koe *{box-sizing:border-box}
.koe{background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;padding:0 20px 56px}
.koe>*{max-width:600px;margin-left:auto;margin-right:auto}
.koe header{padding:16px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.koe .brand{background:none;border:0;padding:0;font:600 14px var(--sans);color:var(--mute);cursor:pointer}
.koe .langs{display:inline-flex;border:1px solid var(--line,#ddd);border-radius:999px;padding:2px}.koe .lang{background:none;border:0;border-radius:999px;padding:4px 10px;font:600 13px var(--sans);color:var(--mute);cursor:pointer}.koe .lang.on{background:var(--ink,#222);color:var(--bg,#fff)}
.koe .bar{height:3px;background:var(--line);border-radius:3px;margin:14px 0 0;overflow:hidden}
.koe .bar i{display:block;height:100%;background:var(--acc);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.koe main{padding-top:44px}
@media(min-width:600px){.koe main{padding-top:72px}}
.koe .anim.fwd{animation:koein .45s cubic-bezier(.2,.8,.2,1)}.koe .anim.bwd{animation:koeinb .45s cubic-bezier(.2,.8,.2,1)}
@keyframes koein{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes koeinb{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes koeflip{from{opacity:0;transform:perspective(800px) rotateY(-70deg)}to{opacity:1;transform:none}}
@keyframes koepop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes koeburst{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@media (prefers-reduced-motion:reduce){.koe *{animation:none!important;transition:none!important}}
.koe .tag{font-size:13px;color:var(--mute);margin-bottom:14px;letter-spacing:.02em}
.koe .tag b{color:var(--acc);font-weight:600}
.koe h1{font:700 30px/1.25 var(--serif);margin:0 0 18px}
.koe .hero{font-size:38px;line-height:1.15}
@media(min-width:600px){.koe .hero{font-size:48px}}
.koe .prompt{font:600 23px/1.5 var(--serif);margin:0 0 22px}
@media(min-width:600px){.koe .prompt{font-size:26px}}
.koe .lead{font:500 21px/1.55 var(--serif);margin:0 0 20px}
.koe .body{font:18px/1.7 var(--serif);margin:0 0 14px}
.koe .quiet,.koe details>summary{font-size:13px;color:var(--mute)}
.koe details{margin:10px 0}.koe details>summary{cursor:pointer;list-style:none}.koe details>summary::-webkit-details-marker{display:none}
.koe details p{font-size:15px;color:var(--mute);margin:8px 0}
.koe .play{margin:0 0 22px;padding-left:14px;border-left:2px solid var(--line);color:var(--mute);font-size:15px}
.koe .play p{margin:2px 0 8px;white-space:pre-line;max-height:7.5em;overflow:auto;font-family:var(--serif)}
.koe .play b{font-size:12px;font-weight:500}
.koe textarea,.koe input.chipin{width:100%;font:18px/1.6 var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:8px 0;resize:none;outline:0;transition:border-color .2s}
.koe textarea:focus,.koe input.chipin:focus{border-color:var(--acc)}
.koe .enter{font-size:12px;color:var(--mute);margin-top:8px;opacity:.8}
.koe .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:40px;flex-wrap:wrap}
.koe button.primary{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 28px;font:600 16px var(--sans);cursor:pointer;transition:transform .15s}
.koe button.primary:active{transform:scale(.97)}
.koe button.primary.acc{background:var(--acc);color:#fff}
.koe button.link{background:none;border:0;padding:8px 0;font:500 14px var(--sans);color:var(--mute);cursor:pointer}
.koe button.link.warn{color:var(--neg)}
.koe a{color:var(--mute)}
.koe .dots{display:flex;gap:6px;margin:0 0 18px}.koe .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}.koe .dots i.on{background:var(--acc)}
.koe .flip{animation:koeflip .5s cubic-bezier(.2,.8,.2,1)}
.koe .flabel{font:600 15px var(--sans);margin:0 0 6px}
.koe .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.koe .chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:15px;animation:koein .3s}
.koe .chip button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:15px;padding:0}
.koe .ring{display:flex;align-items:center;gap:16px;margin:8px 0 0}
.koe .ring svg{flex:0 0 auto}
.koe .ring .t{font:600 22px var(--mono)}
.koe .ringbtns{display:flex;gap:16px;flex-wrap:wrap}
.koe .mini{max-width:none;position:fixed;right:16px;bottom:16px;display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;font:600 12px var(--mono);color:var(--mute);z-index:9}
.koe .times{list-style:none;padding:0;margin:0 0 10px}.koe .times li{display:flex;gap:14px;padding:6px 0;font-size:15px}.koe .times b{color:var(--acc);font:600 14px var(--mono);flex:0 0 52px}
.koe .pair{display:grid;gap:14px;margin:0 0 28px}
.koe .side{padding:18px 20px;border-radius:16px}
.koe .side span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.koe .side p{margin:0;font:600 20px/1.45 var(--serif);white-space:pre-line}
.koe .side.neg{background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--mute)}
.koe .side.pos{background:color-mix(in srgb,var(--acc) 10%,transparent);color:var(--acc)}.koe .side.pos p{color:var(--ink)}
.koe .reveal .side.neg{animation:koein .6s both}
.koe .reveal .side.pos{animation:koein .8s 1.1s both}
.koe .vs{text-align:center;font-size:12px;color:var(--mute);margin:-4px 0}
.koe .reveal .vs{animation:koein .5s .8s both}
.koe .list{margin:0 0 24px}.koe .list div{padding:10px 0;border-bottom:1px solid var(--line)}.koe .list span{font-size:12px;color:var(--mute);display:block}.koe .list p{margin:2px 0 0;white-space:pre-line}
.koe .quests{display:grid;gap:10px;margin:0 0 28px}
.koe .quest{position:relative;display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 16px;font:16px var(--sans);color:var(--ink);cursor:pointer}
.koe .quest i{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;color:#fff;transition:background .2s,border-color .2s}
.koe .quest.on i{background:var(--acc);border-color:var(--acc);animation:koepop .35s}
.koe .quest.on span{color:var(--mute);text-decoration:line-through}
.koe .quest .b{position:absolute;left:27px;top:50%;width:6px;height:6px;border-radius:50%;background:var(--acc);animation:koeburst .7s ease-out forwards;pointer-events:none}
.koe .alldone{font-size:14px;color:var(--acc);margin:-16px 0 24px;animation:koein .4s}
.koe .small{font-size:13px;color:var(--mute);margin:0 0 20px}
.koe .swipe{touch-action:pan-y;user-select:none;padding:30px 22px;border:1px solid var(--line);border-radius:20px;background:var(--paper);text-align:center;font:600 20px/1.5 var(--serif);cursor:grab;transition:transform .25s,background .25s}
.koe .swipe.want{background:color-mix(in srgb,var(--acc2) 12%,var(--paper))}.koe .swipe.hate{background:color-mix(in srgb,var(--neg) 10%,var(--paper))}
.koe .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.koe .two button{border:1px solid var(--line);background:none;border-radius:14px;padding:14px 8px;font:500 15px var(--sans);color:var(--ink);cursor:pointer}
.koe .two button.hate.on{border-color:var(--neg);color:var(--neg)}.koe .two button.want.on{border-color:var(--acc2);color:var(--acc2)}
.koe .hist div{display:flex;flex-wrap:wrap;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.koe .hist button{background:none;border:0;padding:0;font:600 14px var(--sans);color:var(--ink);cursor:pointer}
.koe .hist .want{color:var(--acc2)}.koe .hist .hate{color:var(--neg)}.koe .hist .m{color:var(--mute)}
.koe .jump{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.koe .jump button{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:500 12px var(--sans);color:var(--mute);cursor:pointer}
.koe footer{text-align:center;font-size:12px;color:var(--mute);margin-top:64px;opacity:.8}
.koe textarea.fb{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px}
.koe button.primary:disabled{opacity:.35;cursor:default;transform:none}
.koe .enter button.park{background:none;border:0;padding:0;margin:0;font:inherit;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.koe .slots{margin:6px 0 18px;border-top:1px solid var(--line)}
.koe .slot{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;font:16px/1.5 var(--sans);color:var(--ink);cursor:pointer}
.koe .slot .dot{flex:0 0 10px;height:10px;margin-top:7px;border-radius:50%;border:1.5px solid var(--line)}
.koe .slot.done .dot{background:var(--acc);border-color:var(--acc)}
.koe .slot.sug .dot{border:2px solid var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
.koe .slot b{flex:0 0 60px;font:600 14px/1.5 var(--mono);color:var(--mute);padding-top:1px}
.koe .slot.sug b{color:var(--acc)}
.koe .slot span{flex:1;min-width:0}
.koe .slot.done span{color:var(--mute)}
.koe .slot em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px}
.koe .slot.sug em{color:var(--acc)}
.koe .note{font-size:14px;color:var(--mute);margin:0 0 18px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.koe .play.marked{border-left-color:var(--acc)}.koe .play.marked p{color:var(--ink)}
.koe .mgroup{margin:0 0 16px}.koe .mgroup>span{display:block;font-size:12px;color:var(--mute);margin:0 0 6px}
.koe .mline{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font:16px/1.55 var(--serif);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.koe .mline.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--paper))}
.koe .mline.on:before{content:"✓ ";color:var(--acc);font-weight:600}
.koe button.waiting{color:var(--acc);padding:4px 0}
`,Xa="https://x.com/thedankoe/status/2010751592346030461",qh="https://letters.thedankoe.com/p/how-to-fix-your-entire-life-in-1",yi={intro:{en:"Start",zh:"开始"},morning:{en:"Morning",zh:"早晨"},day:{en:"Day",zh:"白天"},evening:{en:"Evening",zh:"晚上"},game:{en:"Game",zh:"游戏"},summary:{en:"Your page",zh:"你的一页"}},$=[{id:"start",part:"intro",kind:"intro"},{id:"p1",part:"morning",kind:"info",timer:!0,tag:{en:"Part 1 · Morning",zh:"第一部分 · 早晨"},title:{en:"Psychological Excavation – Vision & Anti-Vision",zh:"心理挖掘——愿景与反愿景"},body:{en:`First we must create a new frame, or lens of perception, for your mind to operate from.

Set aside 15-30 minutes to think about and answer these questions. Do not attempt to outsource this contemplation to AI. If you can’t answer these immediately, come back to them later.

Answer all of those first thing in the morning.`,zh:`首先，我们要为你的心智创造一个新的框架，或者说一个新的感知镜头。

留出15–30分钟来思考并回答这些问题。不要试图把这种沉思外包给AI。如果你无法立刻回答，之后再回来补上。

在早晨第一件事就把它们全部答完。`},quote:"Set aside 15-30 minutes … Do not attempt to outsource this contemplation to AI."},{id:"q1",part:"morning",kind:"q",num:"1",en:"What is the dull and persistent dissatisfaction you’ve learned to live with? Not the deep suffering but what you’ve learned to tolerate. (If you don’t hate it, you will tolerate it)",zh:"你已经学会与之共存的、隐约而持久的不满是什么？不是深重的痛苦，而是你已经学会容忍的东西。（如果你不恨它，你就会容忍它）",fields:[{k:"q1"}]},{id:"q2",part:"morning",kind:"q",num:"2",en:"What do you complain about repeatedly but never actually change? Write down the three complaints you’ve voiced most often in the past year.",zh:"你反复抱怨、却从未真正改变的是什么？写下过去一年里你最常说出口的三个抱怨。",fields:[{k:"q2a",en:"Complaint 1",zh:"抱怨 1",short:!0},{k:"q2b",en:"Complaint 2",zh:"抱怨 2",short:!0},{k:"q2c",en:"Complaint 3",zh:"抱怨 3",short:!0}]},{id:"q3",part:"morning",kind:"q",num:"3",en:"For each complaint: What would someone who watched your behavior (not your words) conclude that you actually want?",zh:"针对每一个抱怨：一个只看你的行为（而不是你的话）的人，会得出结论说你真正想要的是什么？",fields:[{k:"q3a",from:"q2a"},{k:"q3b",from:"q2b"},{k:"q3c",from:"q2c"}]},{id:"q4",part:"morning",kind:"q",num:"4",en:"What truth about your current life would be unbearable to admit to someone you deeply respect?",zh:"关于你现在的生活，有什么真相是你无法承受向一个你深深尊敬的人承认的？",fields:[{k:"q4"}]},{id:"av",part:"morning",kind:"info",tag:{en:"Anti-vision",zh:"反愿景"},title:{en:"Turn the pain into an anti-vision",zh:"把痛苦变成反愿景"},body:{en:"Those questions are meant to make you aware of the pain in your current life. Now, we need to turn those into what I call an “anti-vision,” which is a brutal awareness of the life you do not want to live. That way, you can use that negative energy to aim your efforts in a positive direction and act from a place of intrinsic motivation.",zh:"这些问题是为了让你意识到当前生活中的痛苦。现在，我们要把它们变成我所说的“反愿景”（anti-vision）——对你不想过的那种生活的残酷清醒。这样，你就能利用这股负面能量，把努力引向积极的方向，并从内在动机出发去行动。"},play:["q1","q4"],quote:"a brutal awareness of the life you do not want to live."},{id:"q5",part:"morning",kind:"q",num:"5",en:"If absolutely nothing changes for the next five years, describe an average Tuesday. Where do you wake up? What does your body feel like? What’s the first thing you think about? Who’s around you? What do you do between 9am and 6pm? How do you feel at 10pm?",zh:"如果接下来五年什么都没有改变，描述一个普通的星期二。你在哪里醒来？你的身体感觉如何？你想到的第一件事是什么？你身边有谁？早上9点到下午6点你在做什么？晚上10点你感觉如何？",fields:[{k:"q5",rows:7}]},{id:"q6",part:"morning",kind:"q",num:"6",en:"Now do it but for ten years. What have you missed? What opportunities closed? Who gave up on you? What do people say about you when you’re not in the room?",zh:"现在把时间换成十年，再做一遍。你错过了什么？哪些机会关上了？谁放弃了你？你不在场时，人们怎么说你？",play:["q5"],fields:[{k:"q6",rows:6}]},{id:"q7",part:"morning",kind:"q",num:"7",en:"You’re at the end of your life. You lived the safe version. You never broke the pattern. What was the cost? What did you never let yourself feel, try, or become?",zh:"你走到了生命的尽头。你过的是那个安全的版本。你从未打破这个模式。代价是什么？有什么是你从未允许自己去感受、尝试或成为的？",play:["q6"],fields:[{k:"q7",rows:6}]},{id:"q8",part:"morning",kind:"q",num:"8",en:"Who in your life is already living the future you just described? Someone five, ten, twenty years ahead on the same trajectory? What do you feel when you think about becoming them?",zh:"你身边谁已经在过你刚才描述的那种未来？一个在同一条轨迹上领先你五年、十年、二十年的人？想到自己会变成他们，你有什么感受？",fields:[{k:"q8"}]},{id:"q9",part:"morning",kind:"q",num:"9",en:"What identity would you have to give up to actually change? (“I am the type of person who...”) What would it cost you socially to no longer be that person?",zh:"要真正改变，你必须放弃什么身份？（“我是那种……的人”）不再做那个人，会让你在社交上付出什么代价？",fields:[{k:"q9",ph:{en:"I am the type of person who…",zh:"我是那种……的人"}}]},{id:"q10",part:"morning",kind:"q",num:"10",en:"What is the most embarrassing reason you haven’t changed? The one that makes you sound weak, scared, or lazy rather than reasonable?",zh:"你一直没有改变的、最让你难堪的原因是什么？那个让你听起来软弱、害怕或懒惰，而不是合情合理的原因？",fields:[{k:"q10"}]},{id:"q11",part:"morning",kind:"q",num:"11",en:"If your current behavior is a form of self-protection, what exactly are you protecting? And what is that protection costing you?",zh:"如果你现在的行为是一种自我保护，你到底在保护什么？这种保护又让你付出了什么代价？",fields:[{k:"q11"}]},{id:"mvv",part:"morning",kind:"info",tag:{en:"Vision",zh:"愿景"},title:{en:"A minimum viable vision",zh:"最小可行愿景"},body:{en:"If you answered those truthfully, and if you are in the right chapter of your life, you will feel a deep sense of dis-ease and possibly disgust for how you are currently living. Now, we need to orient that energy in a positive direction. We need to create a minimum viable vision, because your vision is like a product. It starts out unclear, but with time and experience, it grows stronger and more potent.",zh:"如果你诚实地回答了这些问题，并且正处在人生中合适的章节，你会对自己现在的生活方式感到深深的不安，甚至厌恶。现在，我们要把这股能量引向积极的方向。我们需要创建一个“最小可行愿景”，因为你的愿景就像一个产品：一开始并不清晰，但随着时间和经验，它会变得越来越强大、越来越有力。"},play:["q7"],quote:"We need to create a minimum viable vision, because your vision is like a product."},{id:"q13",part:"morning",kind:"q",num:"13",en:"Forget practicality for a minute. If you could snap your fingers and be living a different life in three years, not what’s realistic, what you actually want? What does an average Tuesday look like? Same level of detail as question 5.",zh:"暂时忘掉现实可行性。如果你打个响指，三年后就能过上一种不同的生活——不是现实的那种，而是你真正想要的——一个普通的星期二是什么样子？细节程度和第5题一样。",play:["q5"],fields:[{k:"q13",rows:7}]},{id:"q14",part:"morning",kind:"q",num:"14",en:"What would you have to believe about yourself for that life to feel natural rather than forced? Write the identity statement: “I am the type of person who...”",zh:"你必须相信自己是怎样的人，那种生活才会感觉自然而不是勉强？写下身份宣言：“我是那种……的人”",play:["q9"],fields:[{k:"q14",ph:{en:"I am the type of person who…",zh:"我是那种……的人"}}]},{id:"q15",part:"morning",kind:"q",num:"15",en:"What is one thing you would do this week if you were already that person?",zh:"如果你已经是那个人，这周你会做的一件事是什么？",play:["q14"],fields:[{k:"q15",short:!0}]},{id:"p2",part:"day",kind:"info",reminders:!0,tag:{en:"Part 2 · Throughout the day",zh:"第二部分 · 白天"},title:{en:"Interrupting Autopilot – Breaking Unconscious Patterns",zh:"打断自动驾驶——打破无意识模式"},body:{en:`Throughout the day, I want you to contemplate on everything you journaled in part one. You need to consciously force a pattern break.

Take the time right now to create reminders or calendar events in your phone. Include the question in the reminder or event so that you can immediately start thinking about it. The more random and non-conflicting with your schedule there are, the better.`,zh:`在一天之中，我希望你反复思考你在第一部分写下的一切。你需要有意识地强行打破模式。

现在就花点时间，在手机里创建提醒或日历事件。把问题写进提醒或事件里，这样你就能立刻开始思考。时间越随机、越不与你的日程冲突，越好。`},quote:"Take the time right now to create reminders or calendar events in your phone."},{id:"day",part:"day",kind:"dayview"},{id:"i1",part:"day",kind:"checkin",time:"11:00",en:"What am I avoiding right now by doing what I’m doing?",zh:"我现在做的事，是在逃避什么？",fields:[{k:"i1"}]},{id:"i2",part:"day",kind:"checkin",time:"13:30",en:"If someone filmed the last two hours, what would they conclude I want from my life?",zh:"如果有人拍下了我过去两个小时，他们会得出结论说我想从人生中得到什么？",play:["q3a","q3b","q3c"],fields:[{k:"i2"}]},{id:"i3",part:"day",kind:"checkin",time:"15:15",en:"Am I moving toward the life I hate or the life I want?",zh:"我是在走向我讨厌的生活，还是我想要的生活？",play:["q5","q13"],fields:[{k:"i3"}]},{id:"i4",part:"day",kind:"checkin",time:"17:00",en:"What’s the most important thing I’m pretending isn’t important?",zh:"我在假装哪件最重要的事并不重要？",play:["q4"],fields:[{k:"i4"}]},{id:"i5",part:"day",kind:"checkin",time:"19:30",en:"What did I do today out of identity protection rather than genuine desire? (Hint: it’s most things you do)",zh:"我今天做的哪些事，是出于保护身份而不是真正的渴望？（提示：你做的大多数事都是）",play:["q9","q11"],fields:[{k:"i5"}]},{id:"i6",part:"day",kind:"checkin",time:"21:00",en:"When did I feel most alive today? When did I feel most dead?",zh:"今天什么时候我感觉最有活力？什么时候感觉最死气沉沉？",fields:[{k:"i6"}]},{id:"extra",part:"day",kind:"q",tag:{en:"More fuel",zh:"再添一把火"},en:"To add a bit more fuel to the fire, schedule these questions during times where you are either commuting, walking, or lying around.",zh:"为了再添一把火，把这些问题安排在你通勤、散步或躺着的时候。",play:["q9"],note:{en:"The article says “the identity you wrote in question 10”; the identity question is Q9, played back above.",zh:"原文写的是“你在第10题写下的身份”，而身份问题实为第9题，上方回放的是你第9题的答案。"},fields:[{k:"e1",en:"What would change if I stopped needing people to see me as [the identity you wrote in question 10]?",zh:"如果我不再需要别人把我看作［你在第10题写下的身份］，会有什么改变？"},{k:"e2",en:"Where in my life am I trading aliveness for safety?",zh:"在生活的哪些地方，我在用活力换取安全？"},{k:"e3",en:"What’s the smallest version of the person I want to become that I could be tomorrow?",zh:"我想成为的那个人，明天我就能做到的最小版本是什么？"}]},{id:"p3",part:"evening",kind:"info",tag:{en:"Part 3 · Evening",zh:"第三部分 · 晚上"},title:{en:"Synthesizing Insight – Entering A Season Of Progress",zh:"整合洞见——进入一个进步的季节"},body:{en:"If you followed that process, I would be surprised if you didn’t have at least one profound insight that could alter the course of your life. Now, we need to make those known, integrate them into who we are, and act on them to begin solidifying our journey to a new level of mind.",zh:"如果你走完了这个过程，却连一个可能改变人生方向的深刻洞见都没有，我会很意外。现在，我们要让这些洞见显现出来，把它们融入我们是谁，并据此行动，开始巩固我们迈向新心智层级的旅程。"},play:["i6"],quote:"Now, we need to make those known, integrate them into who we are, and act on them"},{id:"mark",part:"evening",kind:"mark"},{id:"q16",part:"evening",kind:"q",num:"16",en:"After today, what feels most true about why you’ve been stuck?",zh:"经过今天，关于你为什么一直停滞不前，什么感觉最真实？",play:["q10"],fields:[{k:"q16"}]},{id:"q17",part:"evening",kind:"q",num:"17",en:"What is the actual enemy? Name it clearly. Not circumstances. Not other people. The internal pattern or belief that has been running the show.",zh:"真正的敌人是什么？清楚地说出它的名字。不是环境，不是别人，而是一直在主导一切的那个内在模式或信念。",play:["q11"],fields:[{k:"q17",short:!0}]},{id:"q18",part:"evening",kind:"q",num:"18",en:"Write a single sentence that captures what you refuse to let your life become. This is your anti-vision compressed. It should make you feel something when you read it.",zh:"写一句话，概括你拒绝让自己的生活变成什么样。这是压缩后的反愿景。读到它时，它应该让你有所触动。",play:["q5","q6","q7"],fields:[{k:"q18",short:!0}]},{id:"q19",part:"evening",kind:"q",num:"19",en:"Write a single sentence that captures what you’re building toward, knowing it will evolve. This is your vision MVP.",zh:"写一句话，概括你正在为之建设的方向，同时知道它会不断演变。这是你的愿景MVP（最小可行版本）。",play:["q13","q14"],fields:[{k:"q19",short:!0}]},{id:"lens",part:"evening",kind:"info",tag:{en:"Goals",zh:"目标"},title:{en:"Goals as lenses",zh:"把目标当作镜头"},body:{en:"Lastly, we need to create goals. Again, these aren’t goals that you set for the sake of achievement. Instead, think of goals as a point of view. A lens that you can exchange to enter the right state of mind to perform the action that will lead away from the life you don’t want. Do not worry about some kind of finish line, because as we will find, it doesn’t exist. Enjoyment is found in progress.",zh:"最后，我们需要制定目标。再说一次，这些不是为了“达成”而设定的目标。相反，把目标看作一种视角——一个可以切换的镜头，让你进入正确的心态，去做那些能让你远离不想要的生活的行动。不要担心什么终点线，因为我们会发现，它并不存在。乐趣在于进步本身。"},quote:"think of goals as a point of view."},{id:"q20",part:"evening",kind:"q",num:"20",lensName:{en:"One-year lens",zh:"一年镜头"},en:"What would have to be true in one year for you to know you’ve broken the old pattern? One concrete thing.",zh:"一年后必须有什么成为事实，你才知道自己已经打破了旧模式？一件具体的事。",play:["q17"],fields:[{k:"q20",short:!0}]},{id:"q21",part:"evening",kind:"q",num:"21",lensName:{en:"One-month lens",zh:"一个月镜头"},en:"What would have to be true in one month for the one-year lens to remain possible?",zh:"一个月后必须有什么成为事实，一年镜头才仍然有可能实现？",play:["q20"],fields:[{k:"q21",short:!0}]},{id:"q22",part:"evening",kind:"q",num:"22",lensName:{en:"Daily lens",zh:"每日镜头"},en:"What are 2-3 actions you can timeblock tomorrow that the person you’re becoming would simply do?",zh:"明天你可以用时间块安排哪2–3个行动——那个你正在成为的人会自然而然去做的事？",play:["q14","q21"],fields:[{k:"q22a",en:"Action 1",zh:"行动 1",short:!0},{k:"q22b",en:"Action 2",zh:"行动 2",short:!0},{k:"q22c",en:"Action 3 (optional)",zh:"行动 3（可选）",short:!0}]},{id:"game",part:"game",kind:"game",tag:{en:"VII · Turn your life into a video game",zh:"七 · 把你的人生变成一款电子游戏"},en:"Now, it may be helpful to organize all of your insights into one coherent plan. Pull out a new page and write down these 6 components:",zh:"现在，把你所有的洞见整理成一个连贯的计划会很有帮助。拿出新的一页，写下这6个组成部分：",fields:[{k:"g1",seed:["q18"],name:{en:"Anti-vision",zh:"反愿景"},role:{en:"stake",zh:"赌注"},en:"What is the bane of my existence, or the life I never want to experience again?",zh:"什么是我存在的祸根，或者我再也不想经历的生活？"},{k:"g2",seed:["q19"],name:{en:"Vision",zh:"愿景"},role:{en:"win",zh:"胜利条件"},en:"What is the ideal life that I think I want and can improve as I work toward it?",zh:"我认为自己想要、并能在努力的过程中不断完善的理想生活是什么？"},{k:"g3",seed:["q20"],name:{en:"1 year goal",zh:"1年目标"},role:{en:"mission",zh:"主线任务"},en:"What will my life look like in 1 year time, and is that closer to the life I want?",zh:"一年后我的生活会是什么样？那是否更接近我想要的生活？"},{k:"g4",seed:["q21"],name:{en:"1 month project",zh:"1个月项目"},role:{en:"boss fight",zh:"Boss战"},en:"What do I need to learn? What skills do I need to acquire? What can I build that will move me closer to the one year goal?",zh:"我需要学什么？我需要掌握哪些技能？我能构建什么，让我更接近一年目标？"},{k:"g5",seed:["q22a","q22b","q22c"],name:{en:"Daily levers",zh:"每日杠杆"},role:{en:"quests",zh:"日常任务"},en:"What are the priority, needle-moving tasks that bring my project closer to completion?",zh:"哪些优先的、真正推动进展的任务，能让我的项目更接近完成？"},{k:"g6",seed:[],name:{en:"Constraints",zh:"约束"},role:{en:"rules",zh:"规则"},en:"What am I not willing to sacrifice to achieve my vision from the ground up?",zh:"为了从零开始实现我的愿景，我不愿意牺牲什么？"}]},{id:"summary",part:"summary",kind:"summary"}],vi={q1:{en:"Q1 · Tolerated dissatisfaction",zh:"Q1 · 容忍的不满"},q2a:{en:"Complaint 1",zh:"抱怨 1"},q2b:{en:"Complaint 2",zh:"抱怨 2"},q2c:{en:"Complaint 3",zh:"抱怨 3"},q3a:{en:"Q3 · What behavior says you want (1)",zh:"Q3 · 行为显示你想要的（1）"},q3b:{en:"Q3 · What behavior says you want (2)",zh:"Q3 · 行为显示你想要的（2）"},q3c:{en:"Q3 · What behavior says you want (3)",zh:"Q3 · 行为显示你想要的（3）"},q4:{en:"Q4 · The unbearable truth",zh:"Q4 · 难以承认的真相"},q5:{en:"Q5 · Tuesday in 5 years, nothing changed",zh:"Q5 · 五年后的星期二（毫无改变）"},q6:{en:"Q6 · Ten years on",zh:"Q6 · 十年后"},q7:{en:"Q7 · The cost of the safe version",zh:"Q7 · 安全版本的代价"},q8:{en:"Q8 · Who is already living it",zh:"Q8 · 谁已经活成那样"},q9:{en:"Q9 · Identity to give up",zh:"Q9 · 必须放弃的身份"},q10:{en:"Q10 · The embarrassing reason",zh:"Q10 · 最难堪的原因"},q11:{en:"Q11 · What you protect, what it costs",zh:"Q11 · 你在保护什么、代价是什么"},q13:{en:"Q13 · Tuesday in 3 years, the life you want",zh:"Q13 · 三
